# Pilot: 120 clips, ~60 steps. Purpose is to prove the pipeline runs and to
# measure peak VRAM -- NOT to produce a usable adapter.
pretrained_path: /home/pc/.cache/huggingface/hub/models--openbmb--VoxCPM2/snapshots/32279effe8c19989596f05d353d1447f51d9e915
train_manifest: /run/media/pc/disk1/text-to-speech/finetune/data-pilot/train.jsonl
val_manifest: /run/media/pc/disk1/text-to-speech/finetune/data-pilot/val.jsonl

sample_rate: 16000
out_sample_rate: 48000

batch_size: 1
grad_accum_steps: 4
num_workers: 2
num_iters: 20
log_interval: 1
valid_interval: 1000
save_interval: 1000
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 5
max_steps: 20
max_batch_tokens: 1024
max_grad_norm: 1.0

save_path: /run/media/pc/disk1/text-to-speech/finetune/checkpoints/pilot
tensorboard: /run/media/pc/disk1/text-to-speech/finetune/logs/pilot

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
