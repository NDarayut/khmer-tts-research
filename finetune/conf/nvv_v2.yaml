# VoxCPM2 NVV tag-expansion LoRA, second attempt -- more data, a real held-out
# split, and more epochs.
#
# WHAT CHANGED FROM nvv_lora.yaml, AND WHY
# ----------------------------------------
# The first run (3.51 h, 2,500 steps) left the tag inert. Measured properly on
# a held-out split it was indistinguishable from the untrained model: deleting
# the tag cost +0.01639 against the base model's +0.01603, 18/28 clips against
# 19/28. See OVERFIT_EXPERIMENT.md section 7.
#
# Three things were wrong, and only the third is a hyperparameter:
#
#   1. The corpus was incomplete. build_corpus_nvv.py globbed
#      `default/train/*.parquet`, which missed an interrupted shard and the
#      dev, test and `other` splits -- 2,941 of 6,256 available rows. Fixed;
#      the corpus is now 5.94 h with 1,473 tagged clips against 871.
#
#   2. The held-out split was 28 tagged clips cut at random, so the same
#      speakers appeared on both sides and the sign test could not resolve
#      anything smaller than an enormous effect. It is now 359 tagged clips
#      over 203 speakers disjoint from train.
#
#   3. 2,500 steps over 1,655 rows at effective batch 8 is 12 epochs. The
#      VoxCPM docs say 1-3 epochs suffice, but that guidance is for speaker
#      cloning -- adapting a capability the model has. Installing a tag it does
#      not have is a different problem, and 12 epochs demonstrably was not
#      enough. 6,000 steps over 2,279 rows is ~21 epochs.
#
# UNCHANGED, DELIBERATELY: r=64 / alpha=64 / lr 1e-4 is exactly the rank the
# VoxCPM documentation prescribes for style and language adaptation, and it is
# what the speech LoRA literature uses. Rank was never the suspect.
#
# enable_proj: true contradicts the docs, which recommend false. It is kept
# because results/diagnosis.md measured it: the LM->DiT projections are the
# only route text-side conditioning has into the acoustic generator, worth
# +13.7 Hz of separation in the layer-1b ablation. The docs' advice is right
# for speaker cloning, where the voice arrives through the audio encoder and
# never crosses that bridge, and wrong for anything conditioned only by text.

pretrained_path: /home/pc/.cache/huggingface/hub/models--openbmb--VoxCPM2/snapshots/32279effe8c19989596f05d353d1447f51d9e915
train_manifest: /run/media/pc/disk1/text-to-speech/finetune/data-nvv/manifests_v2/train.jsonl
val_manifest: /run/media/pc/disk1/text-to-speech/finetune/data-nvv/manifests_v2/val.jsonl

sample_rate: 16000
out_sample_rate: 48000

batch_size: 1
grad_accum_steps: 8
num_workers: 4
num_iters: 6000
log_interval: 25
valid_interval: 500
save_interval: 1000         # 426 MB a checkpoint, and selection is by tag
                            # response rather than by loss, so a few suffice

learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 150
max_steps: 6000
max_batch_tokens: 896
max_grad_norm: 1.0

save_path: /run/media/pc/disk1/text-to-speech/finetune/checkpoints/nvv_v2
tensorboard: /run/media/pc/disk1/text-to-speech/finetune/logs/nvv_v2

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: true         # mandatory; see results/diagnosis.md
  r: 64
  alpha: 64
  dropout: 0.0
